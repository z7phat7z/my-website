<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Vũ Tấn Phát</title>
    <!-- Liên kết file CSS đã biên dịch từ SCSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <h1>Hồ Sơ Cá Nhân</h1>
        <nav>
          <a href="#about">Giới thiệu</a>
          <a href="#skills">Kỹ năng</a>
          <a href="#projects">Dự án</a>
          <a href="#contact">Liên hệ</a>
        </nav>
      </div>
    </header>

    <main>
      <section id="about">
        <article>
          <h2>Giới thiệu bản thân</h2>
          <figure>
            <img
              src="https://via.placeholder.com/150"
              alt="Ảnh đại diện của sinh viên Vũ Tấn Phát"
            />
            <figcaption>Sinh viên: Vũ Tấn Phát</figcaption>
          </figure>
          <p>
            Xin chào, tôi là Vũ Tấn Phát, sinh viên chuyên ngành Kỹ thuật phần
            mềm.
          </p>
        </article>
      </section>

      <!-- ==================== CÂU 3 - BẮT ĐẦU (PHẦN HTML) ==================== -->
      <section id="skills">
        <h2>Kỹ năng và Học tập</h2>
        <table>
          <thead>
            <tr>
              <th>STT</th>
              <th>Kỹ năng</th>
              <th>Công nghệ</th>
              <th>Mức độ</th>
            </tr>
          </thead>
          <tbody id="skills-tbody">
            <!-- Dữ liệu kỹ năng được render động bằng JavaScript -->
          </tbody>
        </table>
      </section>

      <section id="projects">
        <h2>Dự án đã thực hiện</h2>
        <!-- Danh sách dự án -->
      </section>

      <section id="contact">
        <h2>Liên hệ với tôi</h2>
        <form id="contact-form" action="#" method="POST" novalidate>
          <fieldset>
            <legend>Đăng ký nhận tin</legend>

            <label for="fullname">Họ và tên: *</label>
            <input type="text" id="fullname" name="fullname" minlength="2" />
            <small
              id="error-fullname"
              style="
                color: crimson;
                display: block;
                margin-top: 2px;
                margin-bottom: 8px;
              "
            ></small>

            <label for="email">Email: *</label>
            <input type="email" id="email" name="email" />
            <small
              id="error-email"
              style="
                color: crimson;
                display: block;
                margin-top: 2px;
                margin-bottom: 8px;
              "
            ></small>

            <label for="phone">Số điện thoại: *</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              pattern="[0-9]{10,11}"
              title="Nhập 10 hoặc 11 chữ số"
            />
            <small
              id="error-phone"
              style="
                color: crimson;
                display: block;
                margin-top: 2px;
                margin-bottom: 8px;
              "
            ></small>

            <label for="dob">Ngày sinh: *</label>
            <input type="date" id="dob" name="dob" />
            <small
              id="error-dob"
              style="
                color: crimson;
                display: block;
                margin-top: 2px;
                margin-bottom: 8px;
              "
            ></small>

            <div
              id="form-success-msg"
              style="color: #16a34a; font-weight: bold; margin-bottom: 10px"
            ></div>

            <button type="submit">Gửi thông tin</button>
            <button type="reset">Xóa form</button>
          </fieldset>
        </form>
      </section>
      <!-- ==================== CÂU 3 - KẾT THÚC (PHẦN HTML) ==================== -->
    </main>

    <footer>
      <p>&copy; 2026 Vũ Tấn Phát. Thực hành Lập trình Web.</p>
    </footer>

    <!-- Liên kết file JavaScript -->
    <script src="js/script.js" defer></script>
  </body>
</html>
